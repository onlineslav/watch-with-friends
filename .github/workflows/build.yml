name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run dist:win -- --publish never
            artifact: windows
          - os: macos-latest
            command: npm run dist:mac -- --arm64 --publish never
            artifact: mac-apple-silicon
            arch: arm64
          - os: macos-15-intel
            command: npm run dist:mac -- --x64 --publish never
            artifact: mac-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      TURN_CONFIG: ${{ secrets.TURN_CONFIG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check bundled ffmpeg can burn in subtitles
        run: node -e "const out = require('child_process').execFileSync(require('ffmpeg-static'), ['-hide_banner', '-filters']).toString(); if (!/ subtitles /.test(out)) throw new Error('bundled ffmpeg lacks libass')"
      - run: npm test
      - name: Check room joining during a discovery outage
        run: npm run test:connections
      - name: Add TURN relay config
        if: env.TURN_CONFIG != ''
        shell: bash
        run: printf '%s' "$TURN_CONFIG" > config/turn.json
      - run: ${{ matrix.command }}
      - name: Sign Mac update archives and feeds
        if: runner.os == 'macOS'
        env:
          MAC_UPDATE_PRIVATE_KEY: ${{ secrets.MAC_UPDATE_PRIVATE_KEY }}
        run: node scripts/mac-update-feed.js ${{ matrix.arch }}
      - name: Verify Mac updater and packaged profile preservation
        if: runner.os == 'macOS'
        run: npm run test:updater:mac -- --packaged
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/*.dmg
            dist/*.zip
            dist/appcast-*.xml
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "Watch With Friends ${TAG#v}" --notes-file .github/release-notes.md
          fi
